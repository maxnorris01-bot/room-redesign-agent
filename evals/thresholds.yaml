# Starting points, not standards. Tune per project, and change only in dedicated commits.
# These numbers are guesses until validated against a real `make eval-fast-live` run - the first
# project built from this template needed max_latency_p95_s raised twice (an initial 2.0s guess
# turned out unrealistic for any live model call, let alone a multi-step agent one) and
# max_cost_usd raised once, both only after real measurement. See docs/lessons-learned.md.
min_pass_rate: 0.90
max_latency_p95_s: 30.0
max_mean_cost_usd: 0.10
# Bounds this run's TOTAL spend across every case, on top of Config.max_cost_usd (which only
# bounds one case at a time - see evals/run.py). A guess like everything else here - tune it to
# roughly (max_mean_cost_usd * expected case count) with headroom, not a number pulled from thin
# air. This is a CI-time backstop; it doesn't replace a real spend limit on the API account itself.
max_total_cost_usd: 5.00
