<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Shop</title>
<link rel="stylesheet" href="/static/style.css">
<script src="/static/app.js" defer></script>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="top-row">
      <h1 class="brand">Shop</h1>
      <span id="mode-badge" class="badge" hidden></span>
      <span class="spacer"></span>
      <button id="start-over" type="button" class="quiet">Start over</button>
      <span id="start-over-confirm" class="confirm" hidden>
        Start a new session?
        <button id="start-over-yes" type="button" class="quiet danger">Yes, start over</button>
        <button id="start-over-cancel" type="button" class="quiet">Cancel</button>
      </span>
    </div>
    <form id="search-form" class="search" autocomplete="off">
      <input id="request" type="text" maxlength="300" required
        placeholder="What are you looking for? e.g. modern couches under $1000"
        aria-label="Describe what you want to buy">
      <button id="search-btn" type="submit" class="primary">Search</button>
    </form>
    <div id="chips" class="chips" aria-label="How your request was understood"></div>
    <div id="prefs" class="prefs" hidden>
      <p id="prefs-summary" class="prefs-summary"></p>
      <div id="pref-chips" class="chips" aria-label="What you liked and disliked"></div>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="toolbar">
    <div class="status-area">
      <span id="spinner" class="spinner" hidden></span>
      <p id="status" class="status" role="status" aria-live="polite"></p>
      <button id="retry" type="button" class="quiet" hidden>Retry</button>
    </div>
    <div class="actions">
      <span id="again-wrap" class="again" title="Rate a few results first">
        <button id="shop-again" type="button" class="primary" disabled aria-disabled="true">Shop Again</button>
      </span>
      <button id="saved-toggle" type="button" class="outline" aria-expanded="false" aria-controls="saved">Show saved (0)</button>
    </div>
  </div>
  <section id="saved" class="saved" hidden aria-label="Saved results">
    <div class="tabs" role="tablist">
      <button id="tab-loved" type="button" role="tab" aria-selected="true">Loved (0)</button>
      <button id="tab-liked" type="button" role="tab" aria-selected="false">Liked (0)</button>
    </div>
    <div id="saved-row" class="saved-row"></div>
  </section>
  <section id="empty" class="empty">
    <h2>Find something to buy</h2>
    <p>Describe it in your own words. The price and the kind of product are applied as filters;
      style, materials and features decide the order. Rate what you see, and add a note if you like.</p>
    <div id="examples" class="examples"></div>
  </section>
  <section id="grid" class="grid" aria-label="Results"></section>
</main>

<footer class="foot">
  <div class="wrap foot-inner">
    <span id="stats" class="stats"></span>
  </div>
</footer>
</body>
</html>
