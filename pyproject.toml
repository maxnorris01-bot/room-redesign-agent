[project]
name = "app"
version = "0.1.0"
description = "Room Redesign Agent: room photo + budget + style in, furniture list with real links out."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.7.0",
    "httpx2>=2.13.1",
    "pillow>=13.0.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
    "pre-commit>=3.7",
    "types-pillow>=10.2.0.20240822",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app", "src/photoreal"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "evals"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# HTML template strings read worse when wrapped at 100 columns.
"src/app/report.py" = ["E501"]
"src/photoreal/*.py" = ["E501"]
"tests/test_photoreal.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "evals", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
