[project]
name = "app"
version = "0.1.0"
description = "Room Redesign Agent: room photo + budget + style in, furniture list with real links out."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.7.0",
    "httpx2>=2.13.1",
    "pillow>=13.0.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
    "pre-commit>=3.7",
    "types-pillow>=10.2.0.20240822",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app", "src/photoreal"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "evals"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# HTML template strings read worse when wrapped at 100 columns.
"src/app/report.py" = ["E501"]
"src/photoreal/*.py" = ["E501"]
"tests/test_photoreal.py" = ["E501"]
"tests/test_shop_learn.py" = ["E501"]  # long fixture titles and ids
"tests/test_shop_decide.py" = ["E501"]
"tests/test_shop_replay.py" = ["E501"]
"tests/test_shop_stage2e.py" = ["E501"]
"tests/test_shop_stage2f.py" = ["E501"]
"tests/test_shop_again.py" = ["E501"]
"tests/test_shop_stage2g.py" = ["E501"]
"tests/test_shop_tailoring.py" = ["E501"]
"tests/test_shop_topics.py" = ["E501"]
"tests/test_shop_request_understanding.py" = ["E501"]
"tests/test_shop_refine.py" = ["E501"]
"tests/test_shop_reviews_photos.py" = ["E501"]
"tests/test_shop_sdk_shapes.py" = ["E501"]
"tests/test_shop_thinking.py" = ["E501"]
"src/app/shop/decide.py" = ["E501"]  # the lexicon tables and the module notes
"src/app/shop/refine.py" = ["E501"]  # module notes and long expressions
"src/app/shop/evidence.py" = ["E501"]  # module notes and reason strings
"src/app/shop/vocab.py" = ["E501"]  # the keyword tables
"src/app/shop/retailers.py" = ["E501"]  # the editable retailer table
"scripts/shop_diagnose_tagging.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "evals", "scripts"]

[[tool.mypy.overrides]]
# scripts/shop_browser_check.py: Playwright is supplied by `uv run --with`, not installed here
module = ["playwright", "playwright.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
